[package]
name = "hermes-agent-cn-desktop"
version = "0.3.7"
edition = "2021"
description = "HuanxingHermes AI Assistant Desktop"
authors = ["Hermes Agent CN Contributors"]
homepage = "https://hermesagent.org.cn"

[lib]
name = "hermes_agent_cn"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "rustls-tls",
    "stream",
    "cookies",
] }
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
zip = "2"
dirs = "6"
regex = "1"
log = "0.4"
env_logger = "0.11"
tempfile = "3"
base64 = "0.22"
url = "2"
urlencoding = "2"
open = "5"
futures-util = "0.3"
# WebSocket relay to the runtime's native /api/ws (commands/ws_proxy.rs).
# Loopback is always ws:// so no TLS backend feature is needed.
tokio-tungstenite = "0.29"
fs2 = "0.4"
thiserror = "2"
portable-pty = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
getrandom = "0.3"
# Parse $HERMES_HOME/.env for per-spawn child env injection (src/env_file.rs).
# Only from_path_iter is used — the desktop process env is never mutated.
dotenvy = "0.15"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
] }
# Native credential store for the account sk- key (commands/account.rs).
# Windows + macOS only: the ubuntu CI runner has no Secret Service / D-Bus
# session, so on Linux/CI the key falls back to an encrypted file under
# HERMES_HOME (see account::secret_store). keyring is never compiled there.
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
pretty_assertions = "1"
serial_test = "3"
wiremock = "0.6"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
