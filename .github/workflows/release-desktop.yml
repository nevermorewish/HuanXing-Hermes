# Build hermes-agent-cn-desktop installers and attach them to a GitHub
# Release. Triggers on tags matching `v*` (e.g. `v0.3.2`).
#
# Desktop release build runs in parallel for every brand and platform. Each job:
#   1. Installs Node + pnpm + Rust toolchain
#   2. Caches cargo registry and target dir
#   3. `pnpm install`
#   4. Applies the active brand from brands/<BRAND>.json
#   5. Stages the bundled dashboard frontend, bundled skills, bundled plugins,
#      and bundled Hermes-CN-Core runtime payload + manifest for the target platform.
#      macOS keeps the upstream signed zip opaque and verifies nested Mach-O
#      signatures before notarization.
#   6. Builds the Tauri release bundle. The HERMES_RUNTIME_UPDATE_*_DEFAULT
#      env vars are NOT set here; src/process/runtime.rs ships hardcoded
#      production fallbacks. Set them only if you fork the project and
#      want to point the auto-update at a different runtime release
#      pipeline.
#   7. tauri-action uploads .exe / .dmg to the GitHub Release
#      it creates on first run, or appends to an existing tag's release.
#   8. The generated installer payload is uploaded to the configured Linux
#      download server under <remoteRoot>/<brand>/<channel>/ and
#      <remoteRoot>/<brand>/releases/v<version>/.
#   9. After all platforms finish, each brand's latest.json update manifest
#      is generated from the GitHub Release assets and uploaded to the same
#      download server.

name: release-desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to associate the build with (e.g. v0.3.2)"
        required: true
      bundled_runtime_tag:
        description: "Hermes-CN-Core runtime release tag to embed in desktop installers, or latest"
        default: "runtime-v0.16.0-cn.6"
        required: false
      remote_path:
        description: "Linux server download root. Use /www/wwwroot/downloads, or leave empty to use LINUX_DEPLOY_PATH."
        required: false
        default: ""

permissions:
  contents: write

env:
  SERVICE_URL: https://ai.fengchiyun.com
  UPDATE_FEED_BASE_URL: https://ai.fengchiyun.com/downloads

jobs:
  resolve-brands:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      brands: ${{ steps.matrix.outputs.brands }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve brand/platform matrix
        id: matrix
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const platforms = [
            {
              runner: "windows-latest",
              target: "x86_64-pc-windows-msvc",
              runtime_platform: "win32",
              runtime_arch: "x64",
            },
            {
              runner: "macos-14",
              target: "aarch64-apple-darwin",
              runtime_platform: "darwin",
              runtime_arch: "arm64",
            },
            {
              runner: "macos-15-intel",
              target: "x86_64-apple-darwin",
              runtime_platform: "darwin",
              runtime_arch: "x64",
            },
          ];

          const brandsDir = path.join(process.cwd(), "brands");
          const brands = fs.readdirSync(brandsDir)
            .filter((name) => name.endsWith(".json"))
            .map((name) => path.basename(name, ".json"))
            .filter((brand) => brand !== "deepclaw")
            .sort();

          if (brands.length === 0) {
            throw new Error("No brand configs found under brands/");
          }

          const include = brands.flatMap((brand) => platforms.map((platform) => ({
            brand,
            ...platform,
          })));

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `brands=${brands.join(", ")}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(include)}\n`);
          console.log(`Resolved brands: ${brands.join(", ")}`);
          console.log(`Resolved ${include.length} brand/platform build jobs.`);
          NODE

  build:
    needs: resolve-brands
    name: Build ${{ matrix.brand }} / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-brands.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v3
        with:
          version: "9"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # The Tauri sub-crate uses the project root as the manifest dir.
          workspaces: ". -> target"

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Synchronize brand
        env:
          BRAND: ${{ matrix.brand }}
        run: pnpm run brand:sync

      - name: Resolve bundled runtime manifest
        id: runtime_manifest
        shell: bash
        env:
          BUNDLED_RUNTIME_REPO: Eynzof/Hermes-CN-Core
          BUNDLED_RUNTIME_TAG: ${{ github.event.inputs.bundled_runtime_tag || 'runtime-v0.16.0-cn.6' }}
          RUNTIME_PLATFORM: ${{ matrix.runtime_platform }}
          RUNTIME_ARCH: ${{ matrix.runtime_arch }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          (async () => {
            const repo = process.env.BUNDLED_RUNTIME_REPO || "Eynzof/Hermes-CN-Core";
            const tag = process.env.BUNDLED_RUNTIME_TAG || "latest";
            const baseUrl = tag === "latest"
              ? `https://github.com/${repo}/releases/latest/download`
              : `https://github.com/${repo}/releases/download/${encodeURIComponent(tag)}`;
            const platform = process.env.RUNTIME_PLATFORM;
            const arch = process.env.RUNTIME_ARCH;
            const response = await fetch(`${baseUrl}/stable-${platform}-${arch}.json`, {
              headers: { "User-Agent": "hermes-agent-cn-desktop-release-workflow" },
            });
            if (!response.ok) {
              throw new Error(`manifest download failed: HTTP ${response.status}`);
            }
            const manifest = await response.json();
            if (!manifest.sourceCommit) {
              throw new Error("runtime manifest missing sourceCommit");
            }
            if (!manifest.sourceRepo) {
              throw new Error("runtime manifest missing sourceRepo");
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_repo=${manifest.sourceRepo}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_commit=${manifest.sourceCommit}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `runtime_version=${manifest.runtimeVersion}\n`);
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Checkout runtime source for dashboard assets
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.runtime_manifest.outputs.source_repo }}
          ref: ${{ steps.runtime_manifest.outputs.source_commit }}
          path: hermes-agent-cn-source

      - name: Stage bundled dashboard frontend
        run: node scripts/stage-dashboard-web-dist.mjs --source hermes-agent-cn-source

      - name: Stage bundled skills
        run: node scripts/stage-bundled-skills.mjs --source hermes-agent-cn-source

      - name: Stage bundled plugins
        run: node scripts/stage-bundled-plugins.mjs --source hermes-agent-cn-source

      - name: Stage bundled Hermes-CN-Core runtime
        shell: bash
        run: |
          args=(
            scripts/stage-bundled-runtime.mjs
            --repo "Eynzof/Hermes-CN-Core"
            --tag "${{ github.event.inputs.bundled_runtime_tag || 'runtime-v0.16.0-cn.6' }}"
            --platform "${{ matrix.runtime_platform }}"
            --arch "${{ matrix.runtime_arch }}"
          )
          node "${args[@]}"

      - name: Prepare macOS signing credentials
        id: macos_signing
        if: matrix.runtime_platform == 'darwin'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_KEY \
            APPLE_API_ISSUER \
            APPLE_API_PRIVATE_KEY
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping macOS signing/notarization because Apple secrets are missing: ${missing[*]}"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

          mkdir -p "$RUNNER_TEMP/appstoreconnect/private_keys"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          chmod 600 "$RUNNER_TEMP/appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"

          signing_keychain_password="$(uuidgen)"
          signing_keychain="$RUNNER_TEMP/hermes-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/hermes-apple-certificate.p12"

          security create-keychain -p "$signing_keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$signing_keychain_password" "$signing_keychain"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$signing_keychain"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$signing_keychain_password" \
            "$signing_keychain"
          security list-keychains -d user -s "$signing_keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$signing_keychain"

      - name: Verify bundled macOS runtime payload signatures
        if: matrix.runtime_platform == 'darwin'
        shell: bash
        run: scripts/verify-macos-runtime-payload.sh "static/bundled-runtime/hermes-agent-cn-runtime-${{ matrix.runtime_platform }}-${{ matrix.runtime_arch }}.zip"

      - name: Build + upload unsigned installers
        if: matrix.runtime_platform != 'darwin' || steps.macos_signing.outputs.enabled != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          BRAND: ${{ matrix.brand }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        with:
          # tauri-action looks up the tag from this input. On a push:tags
          # trigger it falls back to GITHUB_REF, but we pass it explicitly
          # so workflow_dispatch also works.
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Hermes Agent 涓枃绀惧尯妗岄潰鐗?${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            鑷姩鏋勫缓鐨?Hermes Agent 涓枃绀惧尯妗岄潰鐗堝畨瑁呭寘銆?
            鏈鎸?brands/*.json 鏋勫缓澶氬搧鐗屽畨瑁呭寘锛?{{ needs.resolve-brands.outputs.brands }}銆?
            Windows 绯荤粺瀹夎鍚嶇О銆佸畨瑁呯洰褰曞拰鍗歌浇娉ㄥ唽琛ㄩ」浣跨敤鑻辨枃鍚?            Hermes Agent CN Desktop锛岄伩鍏嶄腑鏂囪矾寰勯€犳垚鍏煎鎬ч棶棰樸€?
            瀹夎鍖呭凡鍐呯疆鏉ヨ嚜 ${{ steps.runtime_manifest.outputs.source_repo }}
            ${{ steps.runtime_manifest.outputs.source_commit }} 鐨?Dashboard 鍓嶇銆佸唴缃妧鑳藉拰鍐呯疆鎻掍欢銆?

            Windows 鍜?macOS 瀹夎鍖呭悓鏃跺唴缃?Hermes-CN-Core runtime
            ${{ steps.runtime_manifest.outputs.runtime_version }}锛屽畨瑁呭悗鍙洿鎺ュ惎鍔ㄦ湰鍦板唴鏍搞€?

            濡傞渶瑕嗙洊 runtime 鏇存柊婧愶紝鍙缃?HERMES_RUNTIME_UPDATE_* 鐜鍙橀噺銆?
          releaseDraft: false
          # Mark SemVer prerelease tags as prerelease on GitHub Releases.
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          args: --target ${{ matrix.target }}

      - name: Build + upload signed macOS installers
        if: matrix.runtime_platform == 'darwin' && steps.macos_signing.outputs.enabled == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          BRAND: ${{ matrix.brand }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          # tauri-action looks up the tag from this input. On a push:tags
          # trigger it falls back to GITHUB_REF, but we pass it explicitly
          # so workflow_dispatch also works.
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Hermes Agent 中文社区桌面版 ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            自动构建的 Hermes Agent 中文社区桌面版安装包。

            本次按 brands/*.json 构建多品牌安装包：${{ needs.resolve-brands.outputs.brands }}。

            Windows 系统安装名称、安装目录和卸载注册表项使用英文名
            Hermes Agent CN Desktop，避免中文路径造成兼容性问题。

            安装包已内置来自 ${{ steps.runtime_manifest.outputs.source_repo }}
            ${{ steps.runtime_manifest.outputs.source_commit }} 的 Dashboard 前端、内置技能和内置插件。

            Windows 和 macOS 安装包同时内置 Hermes-CN-Core runtime
            ${{ steps.runtime_manifest.outputs.runtime_version }}，安装后可直接启动本地内核。

            如需覆盖 runtime 更新源，可设置 HERMES_RUNTIME_UPDATE_* 环境变量。
          releaseDraft: false
          # Mark SemVer prerelease tags as prerelease on GitHub Releases.
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          args: --target ${{ matrix.target }}

      - name: Notarize, staple, verify, and reupload macOS DMG
        if: matrix.runtime_platform == 'darwin' && steps.macos_signing.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
        run: |
          set -euo pipefail
          shopt -s nullglob

          dmgs=(target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "No macOS DMG bundle found" >&2
            exit 1
          fi

          for dmg in "${dmgs[@]}"; do
            echo "Notarizing final DMG: $dmg"
            submit_json="$RUNNER_TEMP/notary-submit-$(basename "$dmg").json"
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --wait \
              --output-format json | tee "$submit_json"

            submission_id="$(python3 - "$submit_json" <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              print(json.load(fh).get("id", ""))
          PY
          )"
            submission_status="$(python3 - "$submit_json" <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              print(json.load(fh).get("status", ""))
          PY
          )"

            if [ "$submission_status" != "Accepted" ]; then
              echo "Notarization failed with status: $submission_status" >&2
              if [ -n "$submission_id" ]; then
                xcrun notarytool log "$submission_id" \
                  --key "$APPLE_API_KEY_PATH" \
                  --key-id "$APPLE_API_KEY" \
                  --issuer "$APPLE_API_ISSUER" \
                  --output-format json | tee "$RUNNER_TEMP/notary-log-$submission_id.json" || true
              fi
              exit 1
            fi

            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl -a -vvv -t open --context context:primary-signature "$dmg"

            # tauri-action already uploaded the first DMG. Replace it with the
            # final notarized + stapled DMG so the release asset is the one users download.
            gh release upload "$RELEASE_TAG" "$dmg" --clobber
          done

      - name: Prepare Linux upload payload
        id: upload_payload
        env:
          BRAND: ${{ matrix.brand }}
          RUNTIME_PLATFORM: ${{ matrix.runtime_platform }}
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $channel = 'latest'
          if ($version -match '-([A-Za-z]+)') {
            $channel = $Matches[1]
          }

          $source = if ($env:RUNTIME_PLATFORM -eq 'win32') {
            "target/$env:TARGET/release/bundle/nsis"
          } elseif ($env:RUNTIME_PLATFORM -eq 'darwin') {
            "target/$env:TARGET/release/bundle/dmg"
          } else {
            throw "Unsupported runtime platform: $env:RUNTIME_PLATFORM"
          }

          if (!(Test-Path $source)) {
            throw "Missing Tauri bundle output: $source"
          }

          $channelOut = "release-upload/$env:BRAND/$channel"
          $archiveOut = "release-upload/$env:BRAND/releases/v$version"

          New-Item -ItemType Directory -Force -Path $channelOut, $archiveOut | Out-Null

          $files = Get-ChildItem $source -File |
            Where-Object { $_.Name -ne 'builder-debug.yml' -and $_.Name -notmatch '\.dSYM$' }

          if ($files.Count -eq 0) {
            throw "No release files found under $source"
          }

          $files | ForEach-Object {
            Copy-Item $_.FullName -Destination $channelOut -Force
            Copy-Item $_.FullName -Destination $archiveOut -Force
          }

          Write-Host "version=$version"
          Write-Host "channel=$channel"
          Write-Host "source=$source"
          Write-Host "upload_dir=$channelOut"
          Get-ChildItem $channelOut | Select-Object Name, Length

          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "channel_dir=$channelOut" >> $env:GITHUB_OUTPUT
          "archive_dir=$archiveOut" >> $env:GITHUB_OUTPUT

      - name: Configure SSH for Linux upload
        env:
          SECRET_LINUX_DEPLOY_HOST: ${{ secrets.LINUX_DEPLOY_HOST }}
          SECRET_LINUX_DEPLOY_PORT: ${{ secrets.LINUX_DEPLOY_PORT }}
          SECRET_LINUX_DEPLOY_USER: ${{ secrets.LINUX_DEPLOY_USER }}
          VAR_LINUX_DEPLOY_HOST: ${{ vars.LINUX_DEPLOY_HOST }}
          VAR_LINUX_DEPLOY_PORT: ${{ vars.LINUX_DEPLOY_PORT }}
          VAR_LINUX_DEPLOY_USER: ${{ vars.LINUX_DEPLOY_USER }}
          LINUX_DEPLOY_KEY: ${{ secrets.LINUX_DEPLOY_KEY }}
          LINUX_DEPLOY_KNOWN_HOSTS: ${{ secrets.LINUX_DEPLOY_KNOWN_HOSTS }}
          SECRET_LINUX_DEPLOY_PATH: ${{ secrets.LINUX_DEPLOY_PATH }}
          VAR_LINUX_DEPLOY_PATH: ${{ vars.LINUX_DEPLOY_PATH }}
          INPUT_REMOTE_PATH: ${{ inputs.remote_path }}
        shell: pwsh
        run: |
          $deployHost = if ([string]::IsNullOrWhiteSpace($env:SECRET_LINUX_DEPLOY_HOST)) { $env:VAR_LINUX_DEPLOY_HOST } else { $env:SECRET_LINUX_DEPLOY_HOST }
          $deployPort = if ([string]::IsNullOrWhiteSpace($env:SECRET_LINUX_DEPLOY_PORT)) { $env:VAR_LINUX_DEPLOY_PORT } else { $env:SECRET_LINUX_DEPLOY_PORT }
          $deployUser = if ([string]::IsNullOrWhiteSpace($env:SECRET_LINUX_DEPLOY_USER)) { $env:VAR_LINUX_DEPLOY_USER } else { $env:SECRET_LINUX_DEPLOY_USER }
          $configuredRemotePath = if ([string]::IsNullOrWhiteSpace($env:SECRET_LINUX_DEPLOY_PATH)) { $env:VAR_LINUX_DEPLOY_PATH } else { $env:SECRET_LINUX_DEPLOY_PATH }

          if ([string]::IsNullOrWhiteSpace($deployHost)) { $deployHost = '43.224.248.112' }
          if ([string]::IsNullOrWhiteSpace($deployUser)) { $deployUser = 'root' }

          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:LINUX_DEPLOY_KEY)) { $missing += 'secrets.LINUX_DEPLOY_KEY' }
          if ([string]::IsNullOrWhiteSpace($env:INPUT_REMOTE_PATH) -and [string]::IsNullOrWhiteSpace($configuredRemotePath)) {
            $missing += 'workflow input remote_path, secrets.LINUX_DEPLOY_PATH, or vars.LINUX_DEPLOY_PATH'
          }
          if ($missing.Count -gt 0) {
            throw "Missing Linux upload configuration: $($missing -join ', ')"
          }

          $port = if ([string]::IsNullOrWhiteSpace($deployPort)) { '22' } else { $deployPort }
          $remotePath = if ([string]::IsNullOrWhiteSpace($env:INPUT_REMOTE_PATH)) { $configuredRemotePath } else { $env:INPUT_REMOTE_PATH }
          $remotePath = $remotePath.TrimEnd('/')

          $sshDir = Join-Path $HOME '.ssh'
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null

          $keyPath = Join-Path $sshDir 'linux_deploy_key'
          ($env:LINUX_DEPLOY_KEY -replace "`r`n", "`n") | Set-Content -Path $keyPath -NoNewline -Encoding ascii
          if ($IsWindows) {
            icacls $keyPath /inheritance:r | Out-Null
            icacls $keyPath /grant:r "$($env:USERNAME):R" | Out-Null
          } else {
            chmod 600 $keyPath
          }

          $knownHostsPath = Join-Path $sshDir 'known_hosts'
          if ([string]::IsNullOrWhiteSpace($env:LINUX_DEPLOY_KNOWN_HOSTS)) {
            New-Item -ItemType File -Force -Path $knownHostsPath | Out-Null
            $strictHostKeyChecking = 'accept-new'
          } else {
            ($env:LINUX_DEPLOY_KNOWN_HOSTS -replace "`r`n", "`n") | Set-Content -Path $knownHostsPath -NoNewline -Encoding ascii
            $strictHostKeyChecking = 'yes'
          }

          "SSH_KEY_PATH=$keyPath" >> $env:GITHUB_ENV
          "SSH_KNOWN_HOSTS_PATH=$knownHostsPath" >> $env:GITHUB_ENV
          "SSH_STRICT_HOST_KEY_CHECKING=$strictHostKeyChecking" >> $env:GITHUB_ENV
          "LINUX_DEPLOY_HOST=$deployHost" >> $env:GITHUB_ENV
          "LINUX_DEPLOY_PORT=$port" >> $env:GITHUB_ENV
          "LINUX_DEPLOY_USER=$deployUser" >> $env:GITHUB_ENV
          "LINUX_DEPLOY_REMOTE_PATH=$remotePath" >> $env:GITHUB_ENV

      - name: Upload package to Linux server
        env:
          BRAND: ${{ matrix.brand }}
          CHANNEL: ${{ steps.upload_payload.outputs.channel }}
          VERSION: ${{ steps.upload_payload.outputs.version }}
          CHANNEL_DIR: ${{ steps.upload_payload.outputs.channel_dir }}
          ARCHIVE_DIR: ${{ steps.upload_payload.outputs.archive_dir }}
        shell: pwsh
        run: |
          function Quote-RemotePath([string]$value) {
            return "'" + $value.Replace("'", "'\''") + "'"
          }

          $remoteRoot = $env:LINUX_DEPLOY_REMOTE_PATH.TrimEnd('/', '\')
          $feedPath = ([Uri]$env:UPDATE_FEED_BASE_URL).AbsolutePath.Trim('/')
          $feedDir = if ($feedPath) { ($feedPath -split '/')[-1] } else { '' }
          $remoteLeaf = Split-Path -Path $remoteRoot -Leaf
          if ($feedDir -and $remoteLeaf -ne $feedDir) {
            $remoteRoot = "$remoteRoot/$feedDir"
          }

          $destinationRoot = "$remoteRoot/$env:BRAND"
          $channelDestination = "$destinationRoot/$env:CHANNEL"
          $archiveDestination = "$destinationRoot/releases/v$env:VERSION"

          $remoteChannel = Quote-RemotePath $channelDestination
          $remoteArchive = Quote-RemotePath $archiveDestination
          $remote = "$env:LINUX_DEPLOY_USER@$env:LINUX_DEPLOY_HOST"

          ssh `
            -i $env:SSH_KEY_PATH `
            -p $env:LINUX_DEPLOY_PORT `
            -o "UserKnownHostsFile=$env:SSH_KNOWN_HOSTS_PATH" `
            -o "StrictHostKeyChecking=$env:SSH_STRICT_HOST_KEY_CHECKING" `
            $remote "mkdir -p $remoteChannel $remoteArchive"
          if ($LASTEXITCODE -ne 0) { throw "Failed to create remote upload directories" }

          $channelFiles = Get-ChildItem $env:CHANNEL_DIR -File | ForEach-Object { $_.FullName }
          $archiveFiles = Get-ChildItem $env:ARCHIVE_DIR -File | ForEach-Object { $_.FullName }

          scp `
            -i $env:SSH_KEY_PATH `
            -P $env:LINUX_DEPLOY_PORT `
            -o "UserKnownHostsFile=$env:SSH_KNOWN_HOSTS_PATH" `
            -o "StrictHostKeyChecking=$env:SSH_STRICT_HOST_KEY_CHECKING" `
            $channelFiles "${remote}:$channelDestination/"
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload channel files" }

          scp `
            -i $env:SSH_KEY_PATH `
            -P $env:LINUX_DEPLOY_PORT `
            -o "UserKnownHostsFile=$env:SSH_KNOWN_HOSTS_PATH" `
            -o "StrictHostKeyChecking=$env:SSH_STRICT_HOST_KEY_CHECKING" `
            $archiveFiles "${remote}:$archiveDestination/"
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload archive files" }

          Write-Host "Uploaded $env:BRAND channel files to $env:UPDATE_FEED_BASE_URL/$env:BRAND/$env:CHANNEL/"
          Write-Host "Uploaded $env:BRAND archive files to $env:UPDATE_FEED_BASE_URL/$env:BRAND/releases/v$env:VERSION/"

  publish-manifests:
    needs:
      - resolve-brands
      - build
    name: Publish desktop update manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate brand latest.json manifests
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node - <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const token = process.env.GH_TOKEN;
          const repo = process.env.GITHUB_REPOSITORY;
          const tag = process.env.RELEASE_TAG;
          const updateFeedBaseUrl = process.env.UPDATE_FEED_BASE_URL.replace(/\/+$/, "");

          if (!token) throw new Error("GH_TOKEN is required");
          if (!repo) throw new Error("GITHUB_REPOSITORY is required");
          if (!tag) throw new Error("RELEASE_TAG is required");

          function normalizeMatchKey(value) {
            return String(value || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
          }

          function encodePathSegment(value) {
            return encodeURIComponent(value).replace(/[!'()*]/g, (char) => `%${char.charCodeAt(0).toString(16).toUpperCase()}`);
          }

          function channelFromSemver(semver) {
            const match = /-([0-9A-Za-z]+)/.exec(semver);
            return match ? match[1] : "latest";
          }

          function platformKey(fileName) {
            const name = fileName.toLowerCase();
            if (name.endsWith(".exe") || name.endsWith(".msi")) return "windows";
            if (name.endsWith(".dmg")) {
              if (name.includes("aarch64") || name.includes("arm64")) return "macos-arm64";
              if (name.includes("x86_64") || name.includes("x64")) return "macos-x64";
              return "macos";
            }
            return null;
          }

          function platformLabel(key) {
            switch (key) {
              case "windows":
                return "Windows installer";
              case "macos-arm64":
                return "macOS Apple Silicon DMG";
              case "macos-x64":
                return "macOS Intel DMG";
              case "macos":
                return "macOS DMG";
              default:
                return key;
            }
          }

          async function githubJson(url) {
            const response = await fetch(url, {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${token}`,
                "User-Agent": "hermes-agent-cn-desktop-release-workflow",
                "X-GitHub-Api-Version": "2022-11-28",
              },
            });
            if (!response.ok) {
              throw new Error(`GitHub API request failed: ${url} HTTP ${response.status}`);
            }
            return response.json();
          }

          async function downloadAsset(asset) {
            const response = await fetch(asset.url, {
              headers: {
                Accept: "application/octet-stream",
                Authorization: `Bearer ${token}`,
                "User-Agent": "hermes-agent-cn-desktop-release-workflow",
                "X-GitHub-Api-Version": "2022-11-28",
              },
            });
            if (!response.ok) {
              throw new Error(`Asset download failed: ${asset.name} HTTP ${response.status}`);
            }
            return Buffer.from(await response.arrayBuffer());
          }

          async function main() {
            const release = await githubJson(`https://api.github.com/repos/${repo}/releases/tags/${encodeURIComponent(tag)}`);
            const semver = tag.replace(/^v/, "");
            const channel = channelFromSemver(semver);
            const generatedAt = new Date().toISOString();
            const brandsDir = path.join(process.cwd(), "brands");
            const brandIds = fs.readdirSync(brandsDir)
              .filter((name) => name.endsWith(".json"))
              .map((name) => path.basename(name, ".json"))
              .filter((brand) => brand !== "deepclaw")
              .sort();

            fs.mkdirSync("release-manifests", { recursive: true });

            for (const brandId of brandIds) {
              const brand = JSON.parse(fs.readFileSync(path.join(brandsDir, `${brandId}.json`), "utf8"));
              const matchKeys = [brand.id, brand.productName, brand.appNameEn]
                .map(normalizeMatchKey)
                .filter(Boolean);

              const matchingAssets = release.assets
                .filter((asset) => platformKey(asset.name))
                .filter((asset) => {
                  const assetKey = normalizeMatchKey(asset.name);
                  return matchKeys.some((key) => assetKey.includes(key));
                })
                .sort((left, right) => left.name.localeCompare(right.name, "en"));

              if (matchingAssets.length === 0) {
                throw new Error(`No installer release assets found for brand ${brandId}`);
              }

              const assets = {};
              for (const asset of matchingAssets) {
                const key = platformKey(asset.name);
                const bytes = await downloadAsset(asset);
                const sha256 = crypto.createHash("sha256").update(bytes).digest("hex");
                const fileName = asset.name;
                const encodedFileName = encodePathSegment(fileName);

                assets[key] = {
                  label: platformLabel(key),
                  platform: key,
                  fileName,
                  size: Number(asset.size) || bytes.length,
                  sha256,
                  url: `${updateFeedBaseUrl}/${brandId}/${channel}/${encodedFileName}`,
                  versionedUrl: `${updateFeedBaseUrl}/${brandId}/releases/${tag}/${encodedFileName}`,
                  sourceUrl: asset.browser_download_url,
                };
              }

              const manifest = {
                repository: repo,
                version: tag,
                semver,
                publishedAt: release.published_at || generatedAt,
                sourceUrl: release.html_url,
                updatedAt: generatedAt,
                assets,
              };

              const brandOut = path.join("release-manifests", brandId);
              fs.mkdirSync(brandOut, { recursive: true });
              fs.writeFileSync(path.join(brandOut, "latest.json"), `${JSON.stringify(manifest, null, 2)}\n`);
              console.log(`Generated ${brandId}/latest.json with assets: ${Object.keys(assets).join(", ")}`);
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Configure SSH for Linux upload
        env:
          SECRET_LINUX_DEPLOY_HOST: ${{ secrets.LINUX_DEPLOY_HOST }}
          SECRET_LINUX_DEPLOY_PORT: ${{ secrets.LINUX_DEPLOY_PORT }}
          SECRET_LINUX_DEPLOY_USER: ${{ secrets.LINUX_DEPLOY_USER }}
          VAR_LINUX_DEPLOY_HOST: ${{ vars.LINUX_DEPLOY_HOST }}
          VAR_LINUX_DEPLOY_PORT: ${{ vars.LINUX_DEPLOY_PORT }}
          VAR_LINUX_DEPLOY_USER: ${{ vars.LINUX_DEPLOY_USER }}
          LINUX_DEPLOY_KEY: ${{ secrets.LINUX_DEPLOY_KEY }}
          LINUX_DEPLOY_KNOWN_HOSTS: ${{ secrets.LINUX_DEPLOY_KNOWN_HOSTS }}
          SECRET_LINUX_DEPLOY_PATH: ${{ secrets.LINUX_DEPLOY_PATH }}
          VAR_LINUX_DEPLOY_PATH: ${{ vars.LINUX_DEPLOY_PATH }}
          INPUT_REMOTE_PATH: ${{ inputs.remote_path }}
        shell: pwsh
        run: |
          $deployHost = if ([string]::IsNullOrWhiteSpace($env:SECRET_LINUX_DEPLOY_HOST)) { $env:VAR_LINUX_DEPLOY_HOST } else { $env:SECRET_LINUX_DEPLOY_HOST }
          $deployPort = if ([string]::IsNullOrWhiteSpace($env:SECRET_LINUX_DEPLOY_PORT)) { $env:VAR_LINUX_DEPLOY_PORT } else { $env:SECRET_LINUX_DEPLOY_PORT }
          $deployUser = if ([string]::IsNullOrWhiteSpace($env:SECRET_LINUX_DEPLOY_USER)) { $env:VAR_LINUX_DEPLOY_USER } else { $env:SECRET_LINUX_DEPLOY_USER }
          $configuredRemotePath = if ([string]::IsNullOrWhiteSpace($env:SECRET_LINUX_DEPLOY_PATH)) { $env:VAR_LINUX_DEPLOY_PATH } else { $env:SECRET_LINUX_DEPLOY_PATH }

          if ([string]::IsNullOrWhiteSpace($deployHost)) { $deployHost = '43.224.248.112' }
          if ([string]::IsNullOrWhiteSpace($deployUser)) { $deployUser = 'root' }

          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:LINUX_DEPLOY_KEY)) { $missing += 'secrets.LINUX_DEPLOY_KEY' }
          if ([string]::IsNullOrWhiteSpace($env:INPUT_REMOTE_PATH) -and [string]::IsNullOrWhiteSpace($configuredRemotePath)) {
            $missing += 'workflow input remote_path, secrets.LINUX_DEPLOY_PATH, or vars.LINUX_DEPLOY_PATH'
          }
          if ($missing.Count -gt 0) {
            throw "Missing Linux upload configuration: $($missing -join ', ')"
          }

          $port = if ([string]::IsNullOrWhiteSpace($deployPort)) { '22' } else { $deployPort }
          $remotePath = if ([string]::IsNullOrWhiteSpace($env:INPUT_REMOTE_PATH)) { $configuredRemotePath } else { $env:INPUT_REMOTE_PATH }
          $remotePath = $remotePath.TrimEnd('/')

          $sshDir = Join-Path $HOME '.ssh'
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null

          $keyPath = Join-Path $sshDir 'linux_deploy_key'
          ($env:LINUX_DEPLOY_KEY -replace "`r`n", "`n") | Set-Content -Path $keyPath -NoNewline -Encoding ascii
          chmod 600 $keyPath

          $knownHostsPath = Join-Path $sshDir 'known_hosts'
          if ([string]::IsNullOrWhiteSpace($env:LINUX_DEPLOY_KNOWN_HOSTS)) {
            New-Item -ItemType File -Force -Path $knownHostsPath | Out-Null
            $strictHostKeyChecking = 'accept-new'
          } else {
            ($env:LINUX_DEPLOY_KNOWN_HOSTS -replace "`r`n", "`n") | Set-Content -Path $knownHostsPath -NoNewline -Encoding ascii
            $strictHostKeyChecking = 'yes'
          }

          "SSH_KEY_PATH=$keyPath" >> $env:GITHUB_ENV
          "SSH_KNOWN_HOSTS_PATH=$knownHostsPath" >> $env:GITHUB_ENV
          "SSH_STRICT_HOST_KEY_CHECKING=$strictHostKeyChecking" >> $env:GITHUB_ENV
          "LINUX_DEPLOY_HOST=$deployHost" >> $env:GITHUB_ENV
          "LINUX_DEPLOY_PORT=$port" >> $env:GITHUB_ENV
          "LINUX_DEPLOY_USER=$deployUser" >> $env:GITHUB_ENV
          "LINUX_DEPLOY_REMOTE_PATH=$remotePath" >> $env:GITHUB_ENV

      - name: Upload latest.json manifests to Linux server
        shell: pwsh
        run: |
          function Quote-RemotePath([string]$value) {
            return "'" + $value.Replace("'", "'\''") + "'"
          }

          $remoteRoot = $env:LINUX_DEPLOY_REMOTE_PATH.TrimEnd('/', '\')
          $feedPath = ([Uri]$env:UPDATE_FEED_BASE_URL).AbsolutePath.Trim('/')
          $feedDir = if ($feedPath) { ($feedPath -split '/')[-1] } else { '' }
          $remoteLeaf = Split-Path -Path $remoteRoot -Leaf
          if ($feedDir -and $remoteLeaf -ne $feedDir) {
            $remoteRoot = "$remoteRoot/$feedDir"
          }

          $remote = "$env:LINUX_DEPLOY_USER@$env:LINUX_DEPLOY_HOST"
          Get-ChildItem release-manifests -Directory | ForEach-Object {
            $brand = $_.Name
            $manifestPath = Join-Path $_.FullName 'latest.json'
            $destinationRoot = "$remoteRoot/$brand"
            $remoteDestination = Quote-RemotePath $destinationRoot

            ssh `
              -i $env:SSH_KEY_PATH `
              -p $env:LINUX_DEPLOY_PORT `
              -o "UserKnownHostsFile=$env:SSH_KNOWN_HOSTS_PATH" `
              -o "StrictHostKeyChecking=$env:SSH_STRICT_HOST_KEY_CHECKING" `
              $remote "mkdir -p $remoteDestination"
            if ($LASTEXITCODE -ne 0) { throw "Failed to create remote manifest directory for $brand" }

            scp `
              -i $env:SSH_KEY_PATH `
              -P $env:LINUX_DEPLOY_PORT `
              -o "UserKnownHostsFile=$env:SSH_KNOWN_HOSTS_PATH" `
              -o "StrictHostKeyChecking=$env:SSH_STRICT_HOST_KEY_CHECKING" `
              $manifestPath "${remote}:$destinationRoot/latest.json"
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload latest.json for $brand" }

            Write-Host "Uploaded $brand update manifest to $env:UPDATE_FEED_BASE_URL/$brand/latest.json"
          }
