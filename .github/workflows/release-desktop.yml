# Build hermes-agent-cn-desktop installers and attach them to a GitHub
# Release. Triggers on tags matching `v*` (e.g. `v0.3.14`).
#
# Desktop release build runs in parallel for every brand and platform. Each job:
#   1. Installs Node + pnpm + Rust toolchain
#   2. Caches cargo registry and target dir
#   3. `pnpm install`
#   4. Applies the active brand from brands/<BRAND>.json
#   5. Stages the bundled dashboard frontend, bundled skills, bundled plugins,
#      and bundled Hermes-CN-Core runtime payload + manifest for the target platform.
#      macOS keeps the upstream signed zip opaque and verifies nested Mach-O
#      signatures before notarization.
#   6. Builds the Tauri release bundle. The runtime update feed points at the
#      production Linux download server by default; set
#      HERMES_RUNTIME_UPDATE_*_DEFAULT only if you fork the project and want
#      to point auto-update at a different runtime release pipeline.
#   7. tauri-action uploads .exe / .dmg to the GitHub Release
#      it creates on first run, or appends to an existing tag's release.
#   8. The generated installer payload is uploaded to the configured Linux
#      download server under <remoteRoot>/<brand>/<channel>/ and
#      <remoteRoot>/<brand>/releases/v<version>/.
#   9. Each brand's latest.json update manifest is merged and uploaded while
#      its platform artifacts are uploaded, so the server manifest does not
#      depend on a separate GitHub Release asset aggregation job.

name: release-desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to associate the build with (e.g. v0.3.14)"
        required: true
      bundled_runtime_tag:
        description: "Hermes-CN-Core runtime release tag to embed in desktop installers, or latest"
        default: "runtime-v0.16.0-cn.6"
        required: false
      remote_path:
        description: "Linux server download root. Use /www/wwwroot/downloads, or leave empty to use LINUX_DEPLOY_PATH."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-desktop
  cancel-in-progress: true

env:
  SERVICE_URL: https://ai.fengchiyun.com
  UPDATE_FEED_BASE_URL: https://ai.fengchiyun.com/downloads
  RUNTIME_UPDATE_FEED_BASE_URL: https://ai.fengchiyun.com/downloads/Hermes-CN-Core/runtime

jobs:
  resolve-brands:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      brands: ${{ steps.matrix.outputs.brands }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve brand/platform matrix
        id: matrix
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const platforms = [
            {
              runner: "windows-latest",
              target: "x86_64-pc-windows-msvc",
              runtime_platform: "win32",
              runtime_arch: "x64",
            },
            {
              runner: "macos-14",
              target: "aarch64-apple-darwin",
              runtime_platform: "darwin",
              runtime_arch: "arm64",
            },
            {
              runner: "macos-15-intel",
              target: "x86_64-apple-darwin",
              runtime_platform: "darwin",
              runtime_arch: "x64",
            },
          ];

          const brandsDir = path.join(process.cwd(), "brands");
          const brands = fs.readdirSync(brandsDir)
            .filter((name) => name.endsWith(".json"))
            .map((name) => path.basename(name, ".json"))
            .filter((brand) => brand !== "deepclaw")
            .sort();

          if (brands.length === 0) {
            throw new Error("No brand configs found under brands/");
          }

          const include = brands.flatMap((brand) => platforms.map((platform) => ({
            brand,
            ...platform,
          })));

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `brands=${brands.join(", ")}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(include)}\n`);
          console.log(`Resolved brands: ${brands.join(", ")}`);
          console.log(`Resolved ${include.length} brand/platform build jobs.`);
          NODE

  prepare-release:
    needs: resolve-brands
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          BUILT_BRANDS: ${{ needs.resolve-brands.outputs.brands }}
        shell: bash
        run: |
          set -euo pipefail

          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null

          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<EOF
          Automated Hermes Agent CN Desktop installers.

          Built brands: $BUILT_BRANDS.

          Windows installer name, install directory, and uninstall registry
          entries use the English name Hermes Agent CN Desktop to avoid
          compatibility issues caused by non-ASCII install paths.

          Override HERMES_RUNTIME_UPDATE_* only when using a custom runtime
          update source.
          EOF

          prerelease_args=()
          if [[ "$RELEASE_TAG" == *-alpha* || "$RELEASE_TAG" == *-beta* || "$RELEASE_TAG" == *-rc* ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" \
            -R "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Hermes Agent CN Desktop $RELEASE_TAG" \
            --notes-file "$notes_file" \
            "${prerelease_args[@]}"

  build:
    needs: [resolve-brands, prepare-release]
    name: Build ${{ matrix.brand }} / ${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJson(needs.resolve-brands.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v3
        with:
          version: "9"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # The Tauri sub-crate uses the project root as the manifest dir.
          workspaces: ". -> target"

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Synchronize brand
        env:
          BRAND: ${{ matrix.brand }}
        run: pnpm run brand:sync

      - name: Resolve bundled runtime manifest
        id: runtime_manifest
        shell: bash
        env:
          BUNDLED_RUNTIME_REPO: Eynzof/Hermes-CN-Core
          BUNDLED_RUNTIME_TAG: ${{ github.event.inputs.bundled_runtime_tag || 'runtime-v0.16.0-cn.6' }}
          RUNTIME_PLATFORM: ${{ matrix.runtime_platform }}
          RUNTIME_ARCH: ${{ matrix.runtime_arch }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          (async () => {
            const repo = process.env.BUNDLED_RUNTIME_REPO || "Eynzof/Hermes-CN-Core";
            const tag = process.env.BUNDLED_RUNTIME_TAG || "latest";
            const baseUrl = tag === "latest"
              ? `https://github.com/${repo}/releases/latest/download`
              : `https://github.com/${repo}/releases/download/${encodeURIComponent(tag)}`;
            const platform = process.env.RUNTIME_PLATFORM;
            const arch = process.env.RUNTIME_ARCH;
            const response = await fetch(`${baseUrl}/stable-${platform}-${arch}.json`, {
              headers: { "User-Agent": "hermes-agent-cn-desktop-release-workflow" },
            });
            if (!response.ok) {
              throw new Error(`manifest download failed: HTTP ${response.status}`);
            }
            const manifest = await response.json();
            if (!manifest.sourceCommit) {
              throw new Error("runtime manifest missing sourceCommit");
            }
            if (!manifest.sourceRepo) {
              throw new Error("runtime manifest missing sourceRepo");
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_repo=${manifest.sourceRepo}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_commit=${manifest.sourceCommit}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `runtime_version=${manifest.runtimeVersion}\n`);
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Checkout runtime source for dashboard assets
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.runtime_manifest.outputs.source_repo }}
          ref: ${{ steps.runtime_manifest.outputs.source_commit }}
          path: hermes-agent-cn-source

      - name: Stage bundled dashboard frontend
        run: node scripts/stage-dashboard-web-dist.mjs --source hermes-agent-cn-source

      - name: Stage bundled skills
        run: node scripts/stage-bundled-skills.mjs --source hermes-agent-cn-source

      - name: Stage bundled plugins
        run: node scripts/stage-bundled-plugins.mjs --source hermes-agent-cn-source

      - name: Stage bundled Hermes-CN-Core runtime
        shell: bash
        run: |
          args=(
            scripts/stage-bundled-runtime.mjs
            --repo "Eynzof/Hermes-CN-Core"
            --tag "${{ github.event.inputs.bundled_runtime_tag || 'runtime-v0.16.0-cn.6' }}"
            --platform "${{ matrix.runtime_platform }}"
            --arch "${{ matrix.runtime_arch }}"
          )
          node "${args[@]}"

      - name: Prepare macOS signing credentials
        id: macos_signing
        if: matrix.runtime_platform == 'darwin'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_KEY \
            APPLE_API_ISSUER \
            APPLE_API_PRIVATE_KEY
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping macOS signing/notarization because Apple secrets are missing: ${missing[*]}"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

          mkdir -p "$RUNNER_TEMP/appstoreconnect/private_keys"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          chmod 600 "$RUNNER_TEMP/appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"

          signing_keychain_password="$(uuidgen)"
          signing_keychain="$RUNNER_TEMP/hermes-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/hermes-apple-certificate.p12"

          security create-keychain -p "$signing_keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$signing_keychain_password" "$signing_keychain"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$signing_keychain"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$signing_keychain_password" \
            "$signing_keychain"
          security list-keychains -d user -s "$signing_keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$signing_keychain"

      - name: Verify bundled macOS runtime payload signatures
        if: matrix.runtime_platform == 'darwin'
        shell: bash
        run: scripts/verify-macos-runtime-payload.sh "static/bundled-runtime/hermes-agent-cn-runtime-${{ matrix.runtime_platform }}-${{ matrix.runtime_arch }}.zip"

      - name: Build + upload unsigned installers
        if: matrix.runtime_platform != 'darwin' || steps.macos_signing.outputs.enabled != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          BRAND: ${{ matrix.brand }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        with:
          # tauri-action looks up the tag from this input. On a push:tags
          # trigger it falls back to GITHUB_REF, but we pass it explicitly
          # so workflow_dispatch also works.
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Hermes Agent CN Desktop ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            Automated Hermes Agent CN Desktop installers.

            Built brands: ${{ needs.resolve-brands.outputs.brands }}.

            Windows installer name, install directory, and uninstall registry
            entries use the English name Hermes Agent CN Desktop to avoid
            compatibility issues caused by non-ASCII install paths.

            Bundled dashboard/runtime source:
            ${{ steps.runtime_manifest.outputs.source_repo }}
            ${{ steps.runtime_manifest.outputs.source_commit }}.

            Bundled Hermes-CN-Core runtime:
            ${{ steps.runtime_manifest.outputs.runtime_version }}.

            Override HERMES_RUNTIME_UPDATE_* only when using a custom runtime
            update source.
          releaseDraft: false
          # Mark SemVer prerelease tags as prerelease on GitHub Releases.
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          args: --target ${{ matrix.target }}

      - name: Build + upload signed macOS installers
        if: matrix.runtime_platform == 'darwin' && steps.macos_signing.outputs.enabled == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          BRAND: ${{ matrix.brand }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          # tauri-action looks up the tag from this input. On a push:tags
          # trigger it falls back to GITHUB_REF, but we pass it explicitly
          # so workflow_dispatch also works.
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Hermes Agent CN Desktop ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            Automated Hermes Agent CN Desktop installers.

            Built brands: ${{ needs.resolve-brands.outputs.brands }}.

            Windows installer name, install directory, and uninstall registry
            entries use the English name Hermes Agent CN Desktop to avoid
            compatibility issues caused by non-ASCII install paths.

            Bundled dashboard/runtime source:
            ${{ steps.runtime_manifest.outputs.source_repo }}
            ${{ steps.runtime_manifest.outputs.source_commit }}.

            Bundled Hermes-CN-Core runtime:
            ${{ steps.runtime_manifest.outputs.runtime_version }}.

            Override HERMES_RUNTIME_UPDATE_* only when using a custom runtime
            update source.
          releaseDraft: false
          # Mark SemVer prerelease tags as prerelease on GitHub Releases.
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          args: --target ${{ matrix.target }}

      - name: Notarize, staple, verify, and reupload macOS DMG
        if: matrix.runtime_platform == 'darwin' && steps.macos_signing.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
        run: |
          set -euo pipefail
          shopt -s nullglob

          dmgs=(target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "No macOS DMG bundle found" >&2
            exit 1
          fi

          for dmg in "${dmgs[@]}"; do
            echo "Notarizing final DMG: $dmg"
            submit_json="$RUNNER_TEMP/notary-submit-$(basename "$dmg").json"
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --wait \
              --output-format json | tee "$submit_json"

            submission_id="$(python3 - "$submit_json" <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              print(json.load(fh).get("id", ""))
          PY
          )"
            submission_status="$(python3 - "$submit_json" <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              print(json.load(fh).get("status", ""))
          PY
          )"

            if [ "$submission_status" != "Accepted" ]; then
              echo "Notarization failed with status: $submission_status" >&2
              if [ -n "$submission_id" ]; then
                xcrun notarytool log "$submission_id" \
                  --key "$APPLE_API_KEY_PATH" \
                  --key-id "$APPLE_API_KEY" \
                  --issuer "$APPLE_API_ISSUER" \
                  --output-format json | tee "$RUNNER_TEMP/notary-log-$submission_id.json" || true
              fi
              exit 1
            fi

            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl -a -vvv -t open --context context:primary-signature "$dmg"

            # tauri-action already uploaded the first DMG. Replace it with the
            # final notarized + stapled DMG so the release asset is the one users download.
            gh release upload "$RELEASE_TAG" "$dmg" --clobber
          done

      - name: Prepare Linux upload payload
        id: upload_payload
        env:
          BRAND: ${{ matrix.brand }}
          RUNTIME_PLATFORM: ${{ matrix.runtime_platform }}
          RUNTIME_ARCH: ${{ matrix.runtime_arch }}
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $channel = 'latest'
          if ($version -match '-([A-Za-z]+)') {
            $channel = $Matches[1]
          }

          $source = if ($env:RUNTIME_PLATFORM -eq 'win32') {
            "target/$env:TARGET/release/bundle/nsis"
          } elseif ($env:RUNTIME_PLATFORM -eq 'darwin') {
            "target/$env:TARGET/release/bundle/dmg"
          } else {
            throw "Unsupported runtime platform: $env:RUNTIME_PLATFORM"
          }

          if (!(Test-Path $source)) {
            throw "Missing Tauri bundle output: $source"
          }

          $channelOut = "release-upload/$env:BRAND/$channel"
          $archiveOut = "release-upload/$env:BRAND/releases/v$version"

          New-Item -ItemType Directory -Force -Path $channelOut, $archiveOut | Out-Null

          $files = Get-ChildItem $source -File |
            Where-Object { $_.Name -ne 'builder-debug.yml' -and $_.Name -notmatch '\.dSYM$' }

          if ($files.Count -eq 0) {
            throw "No release files found under $source"
          }

          $files | ForEach-Object {
            Copy-Item $_.FullName -Destination $channelOut -Force
            Copy-Item $_.FullName -Destination $archiveOut -Force
          }

          $platformKey = if ($env:RUNTIME_PLATFORM -eq 'win32') {
            'windows'
          } elseif ($env:RUNTIME_PLATFORM -eq 'darwin' -and $env:RUNTIME_ARCH -eq 'arm64') {
            'macos-arm64'
          } elseif ($env:RUNTIME_PLATFORM -eq 'darwin') {
            'macos-x64'
          } else {
            $env:RUNTIME_PLATFORM
          }

          $platformLabel = switch ($platformKey) {
            'windows' { 'Windows installer' }
            'macos-arm64' { 'macOS Apple Silicon DMG' }
            'macos-x64' { 'macOS Intel DMG' }
            default { $platformKey }
          }

          $assetFile = $files |
            Where-Object { $_.Extension -in @('.exe', '.msi', '.dmg') } |
            Select-Object -First 1
          if (-not $assetFile) {
            throw "No installer asset found under $source"
          }

          $encodedFileName = [Uri]::EscapeDataString($assetFile.Name)
          $githubAssetFileName = $assetFile.Name -replace ' ', '.'
          $encodedGithubAssetFileName = [Uri]::EscapeDataString($githubAssetFileName)
          $assetSha256 = (Get-FileHash -Algorithm SHA256 $assetFile.FullName).Hash.ToLowerInvariant()
          $assetPatchPath = "release-upload/$env:BRAND/$platformKey-asset.json"
          $assetPatch = [ordered]@{
            platformKey = $platformKey
            asset = [ordered]@{
              label = $platformLabel
              platform = $platformKey
              fileName = $assetFile.Name
              size = $assetFile.Length
              sha256 = $assetSha256
              url = "$env:UPDATE_FEED_BASE_URL/$env:BRAND/$channel/$encodedFileName"
              versionedUrl = "$env:UPDATE_FEED_BASE_URL/$env:BRAND/releases/v$version/$encodedFileName"
              sourceUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$encodedGithubAssetFileName"
            }
          }
          $assetPatch | ConvertTo-Json -Depth 20 | Set-Content -Path $assetPatchPath -Encoding utf8

          Write-Host "version=$version"
          Write-Host "channel=$channel"
          Write-Host "source=$source"
          Write-Host "upload_dir=$channelOut"
          Write-Host "asset_patch=$assetPatchPath"
          Get-ChildItem $channelOut | Select-Object Name, Length

          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "channel_dir=$channelOut" >> $env:GITHUB_OUTPUT
          "archive_dir=$archiveOut" >> $env:GITHUB_OUTPUT
          "asset_patch=$assetPatchPath" >> $env:GITHUB_OUTPUT

      - name: Configure SSH for Linux upload
        env:
          SECRET_LINUX_DEPLOY_HOST: ${{ secrets.LINUX_DEPLOY_HOST }}
          SECRET_LINUX_DEPLOY_PORT: ${{ secrets.LINUX_DEPLOY_PORT }}
          SECRET_LINUX_DEPLOY_USER: ${{ secrets.LINUX_DEPLOY_USER }}
          VAR_LINUX_DEPLOY_HOST: ${{ vars.LINUX_DEPLOY_HOST }}
          VAR_LINUX_DEPLOY_PORT: ${{ vars.LINUX_DEPLOY_PORT }}
          VAR_LINUX_DEPLOY_USER: ${{ vars.LINUX_DEPLOY_USER }}
          LINUX_DEPLOY_KEY: ${{ secrets.LINUX_DEPLOY_KEY }}
          LINUX_DEPLOY_KNOWN_HOSTS: ${{ secrets.LINUX_DEPLOY_KNOWN_HOSTS }}
          SECRET_LINUX_DEPLOY_PATH: ${{ secrets.LINUX_DEPLOY_PATH }}
          VAR_LINUX_DEPLOY_PATH: ${{ vars.LINUX_DEPLOY_PATH }}
          INPUT_REMOTE_PATH: ${{ inputs.remote_path }}
        shell: pwsh
        run: |
          $deployHost = if ([string]::IsNullOrWhiteSpace($env:SECRET_LINUX_DEPLOY_HOST)) { $env:VAR_LINUX_DEPLOY_HOST } else { $env:SECRET_LINUX_DEPLOY_HOST }
          $deployPort = if ([string]::IsNullOrWhiteSpace($env:SECRET_LINUX_DEPLOY_PORT)) { $env:VAR_LINUX_DEPLOY_PORT } else { $env:SECRET_LINUX_DEPLOY_PORT }
          $deployUser = if ([string]::IsNullOrWhiteSpace($env:SECRET_LINUX_DEPLOY_USER)) { $env:VAR_LINUX_DEPLOY_USER } else { $env:SECRET_LINUX_DEPLOY_USER }
          $configuredRemotePath = if ([string]::IsNullOrWhiteSpace($env:SECRET_LINUX_DEPLOY_PATH)) { $env:VAR_LINUX_DEPLOY_PATH } else { $env:SECRET_LINUX_DEPLOY_PATH }

          if ([string]::IsNullOrWhiteSpace($deployHost)) { $deployHost = '43.224.248.112' }
          if ([string]::IsNullOrWhiteSpace($deployUser)) { $deployUser = 'root' }

          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:LINUX_DEPLOY_KEY)) { $missing += 'secrets.LINUX_DEPLOY_KEY' }
          if ([string]::IsNullOrWhiteSpace($env:INPUT_REMOTE_PATH) -and [string]::IsNullOrWhiteSpace($configuredRemotePath)) {
            $missing += 'workflow input remote_path, secrets.LINUX_DEPLOY_PATH, or vars.LINUX_DEPLOY_PATH'
          }
          if ($missing.Count -gt 0) {
            throw "Missing Linux upload configuration: $($missing -join ', ')"
          }

          $port = if ([string]::IsNullOrWhiteSpace($deployPort)) { '22' } else { $deployPort }
          $remotePath = if ([string]::IsNullOrWhiteSpace($env:INPUT_REMOTE_PATH)) { $configuredRemotePath } else { $env:INPUT_REMOTE_PATH }
          $remotePath = $remotePath.TrimEnd('/')

          $sshDir = Join-Path $HOME '.ssh'
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null

          $keyPath = Join-Path $sshDir 'linux_deploy_key'
          ($env:LINUX_DEPLOY_KEY -replace "`r`n", "`n") | Set-Content -Path $keyPath -NoNewline -Encoding ascii
          if ($IsWindows) {
            icacls $keyPath /inheritance:r | Out-Null
            icacls $keyPath /grant:r "$($env:USERNAME):R" | Out-Null
          } else {
            chmod 600 $keyPath
          }

          $knownHostsPath = Join-Path $sshDir 'known_hosts'
          if ([string]::IsNullOrWhiteSpace($env:LINUX_DEPLOY_KNOWN_HOSTS)) {
            New-Item -ItemType File -Force -Path $knownHostsPath | Out-Null
            $strictHostKeyChecking = 'accept-new'
          } else {
            ($env:LINUX_DEPLOY_KNOWN_HOSTS -replace "`r`n", "`n") | Set-Content -Path $knownHostsPath -NoNewline -Encoding ascii
            $strictHostKeyChecking = 'yes'
          }

          "SSH_KEY_PATH=$keyPath" >> $env:GITHUB_ENV
          "SSH_KNOWN_HOSTS_PATH=$knownHostsPath" >> $env:GITHUB_ENV
          "SSH_STRICT_HOST_KEY_CHECKING=$strictHostKeyChecking" >> $env:GITHUB_ENV
          "LINUX_DEPLOY_HOST=$deployHost" >> $env:GITHUB_ENV
          "LINUX_DEPLOY_PORT=$port" >> $env:GITHUB_ENV
          "LINUX_DEPLOY_USER=$deployUser" >> $env:GITHUB_ENV
          "LINUX_DEPLOY_REMOTE_PATH=$remotePath" >> $env:GITHUB_ENV

      - name: Upload package to Linux server
        env:
          BRAND: ${{ matrix.brand }}
          CHANNEL: ${{ steps.upload_payload.outputs.channel }}
          VERSION: ${{ steps.upload_payload.outputs.version }}
          CHANNEL_DIR: ${{ steps.upload_payload.outputs.channel_dir }}
          ARCHIVE_DIR: ${{ steps.upload_payload.outputs.archive_dir }}
          ASSET_PATCH: ${{ steps.upload_payload.outputs.asset_patch }}
        shell: pwsh
        run: |
          function Quote-RemotePath([string]$value) {
            return "'" + $value.Replace("'", "'\''") + "'"
          }

          function Get-RetryDelaySeconds([int]$attempt) {
            return [Math]::Min(120, 15 * [Math]::Pow(2, $attempt - 1))
          }

          $sshCommonOptions = @(
            "-i", $env:SSH_KEY_PATH,
            "-o", "UserKnownHostsFile=$env:SSH_KNOWN_HOSTS_PATH",
            "-o", "StrictHostKeyChecking=$env:SSH_STRICT_HOST_KEY_CHECKING",
            "-o", "BatchMode=yes",
            "-o", "ConnectTimeout=60",
            "-o", "ConnectionAttempts=3",
            "-o", "ServerAliveInterval=15",
            "-o", "ServerAliveCountMax=20",
            "-o", "TCPKeepAlive=yes",
            "-o", "IPQoS=throughput"
          )

          function Invoke-SshCommand([string]$command, [string]$failureMessage) {
            $attempt = 1
            $maxAttempts = 6
            while ($attempt -le $maxAttempts) {
              Write-Host "Running remote command attempt ${attempt}/${maxAttempts}"
              ssh @sshCommonOptions -p $env:LINUX_DEPLOY_PORT $remote $command
              $exitCode = $LASTEXITCODE
              if ($exitCode -eq 0) { return }
              if ($attempt -eq $maxAttempts) {
                throw "$failureMessage (exit code $exitCode) after $maxAttempts attempts"
              }
              $delay = Get-RetryDelaySeconds $attempt
              Write-Host "Remote command failed with exit code $exitCode; retrying in $delay seconds."
              Start-Sleep -Seconds $delay
              $attempt += 1
            }
          }

          function Read-SshCommand([string]$command, [string]$failureMessage) {
            $attempt = 1
            $maxAttempts = 6
            while ($attempt -le $maxAttempts) {
              Write-Host "Reading remote command output attempt ${attempt}/${maxAttempts}"
              $output = ssh @sshCommonOptions -p $env:LINUX_DEPLOY_PORT $remote $command
              $exitCode = $LASTEXITCODE
              if ($exitCode -eq 0) { return $output }
              if ($attempt -eq $maxAttempts) {
                throw "$failureMessage (exit code $exitCode) after $maxAttempts attempts"
              }
              $delay = Get-RetryDelaySeconds $attempt
              Write-Host "Remote read failed with exit code $exitCode; retrying in $delay seconds."
              Start-Sleep -Seconds $delay
              $attempt += 1
            }
          }

          function Invoke-RemoteUpload([string]$filePath, [string]$remoteDirectory, [string]$label) {
            $attempt = 1
            $maxAttempts = 6
            while ($attempt -le $maxAttempts) {
              Write-Host "Uploading $label attempt ${attempt}/${maxAttempts}: $filePath"
              scp `
                @sshCommonOptions `
                -P $env:LINUX_DEPLOY_PORT `
                $filePath "${remote}:$remoteDirectory/"
              $exitCode = $LASTEXITCODE
              if ($exitCode -eq 0) { return }
              if ($attempt -eq $maxAttempts) {
                throw "Failed to upload $label file after $maxAttempts attempts: $filePath"
              }
              $delay = Get-RetryDelaySeconds $attempt
              Write-Host "Upload failed with exit code $exitCode; retrying in $delay seconds."
              Start-Sleep -Seconds $delay
              $attempt += 1
            }
          }

          function Enter-RemoteLock([string]$lockDirectory) {
            $quotedLock = Quote-RemotePath $lockDirectory
            $attempt = 1
            $maxAttempts = 120
            while ($attempt -le $maxAttempts) {
              Write-Host "Acquiring remote latest.json lock attempt ${attempt}/${maxAttempts}: $lockDirectory"
              ssh @sshCommonOptions -p $env:LINUX_DEPLOY_PORT $remote "mkdir $quotedLock 2>/dev/null"
              if ($LASTEXITCODE -eq 0) { return }

              if (($attempt % 12) -eq 0) {
                ssh @sshCommonOptions -p $env:LINUX_DEPLOY_PORT $remote "find $quotedLock -maxdepth 0 -type d -mmin +30 -exec rm -rf {} + 2>/dev/null || true"
              }

              Start-Sleep -Seconds 5
              $attempt += 1
            }

            throw "Failed to acquire remote latest.json lock after $maxAttempts attempts: $lockDirectory"
          }

          function Exit-RemoteLock([string]$lockDirectory) {
            $quotedLock = Quote-RemotePath $lockDirectory
            Invoke-SshCommand "rmdir $quotedLock 2>/dev/null || true" "Failed to release remote latest.json lock"
          }

          function Get-SemverParts([string]$value) {
            $normalized = $value.Trim().TrimStart('v')
            if ($normalized -notmatch '^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+.*)?$') {
              return $null
            }

            return [pscustomobject]@{
              Major = [int]$Matches[1]
              Minor = [int]$Matches[2]
              Patch = [int]$Matches[3]
              Prerelease = if ($Matches.Count -gt 4) { [string]$Matches[4] } else { '' }
            }
          }

          function Compare-Semver([string]$left, [string]$right) {
            $leftParts = Get-SemverParts $left
            $rightParts = Get-SemverParts $right
            if (-not $leftParts -or -not $rightParts) {
              return [string]::Compare($left, $right, [System.StringComparison]::OrdinalIgnoreCase)
            }

            foreach ($part in @('Major', 'Minor', 'Patch')) {
              if ($leftParts.$part -gt $rightParts.$part) { return 1 }
              if ($leftParts.$part -lt $rightParts.$part) { return -1 }
            }

            if ([string]::IsNullOrWhiteSpace($leftParts.Prerelease) -and -not [string]::IsNullOrWhiteSpace($rightParts.Prerelease)) {
              return 1
            }
            if (-not [string]::IsNullOrWhiteSpace($leftParts.Prerelease) -and [string]::IsNullOrWhiteSpace($rightParts.Prerelease)) {
              return -1
            }

            return [string]::Compare($leftParts.Prerelease, $rightParts.Prerelease, [System.StringComparison]::OrdinalIgnoreCase)
          }

          $remoteRoot = $env:LINUX_DEPLOY_REMOTE_PATH.TrimEnd('/', '\')
          $feedPath = ([Uri]$env:UPDATE_FEED_BASE_URL).AbsolutePath.Trim('/')
          $feedDir = if ($feedPath) { ($feedPath -split '/')[-1] } else { '' }
          $remoteLeaf = Split-Path -Path $remoteRoot -Leaf
          if ($feedDir -and $remoteLeaf -ne $feedDir) {
            $remoteRoot = "$remoteRoot/$feedDir"
          }

          $destinationRoot = "$remoteRoot/$env:BRAND"
          $channelDestination = "$destinationRoot/$env:CHANNEL"
          $archiveDestination = "$destinationRoot/releases/v$env:VERSION"

          $remoteChannel = Quote-RemotePath $channelDestination
          $remoteArchive = Quote-RemotePath $archiveDestination
          $remote = "$env:LINUX_DEPLOY_USER@$env:LINUX_DEPLOY_HOST"

          Invoke-SshCommand "mkdir -p $remoteChannel $remoteArchive" "Failed to create remote upload directories"

          $channelFiles = Get-ChildItem $env:CHANNEL_DIR -File | ForEach-Object { $_.FullName }
          $archiveFiles = Get-ChildItem $env:ARCHIVE_DIR -File | ForEach-Object { $_.FullName }

          foreach ($file in $channelFiles) {
            Invoke-RemoteUpload $file $channelDestination "channel"
          }

          foreach ($file in $archiveFiles) {
            Invoke-RemoteUpload $file $archiveDestination "archive"
          }

          $latestLockDirectory = "$destinationRoot/.latest-json.lock"
          Enter-RemoteLock $latestLockDirectory
          try {
            $assetPatch = Get-Content $env:ASSET_PATCH -Raw | ConvertFrom-Json
            $latestDir = Join-Path $env:RUNNER_TEMP "$env:BRAND-latest"
            New-Item -ItemType Directory -Force -Path $latestDir | Out-Null
            $latestPath = Join-Path $latestDir "latest.json"
            $remoteLatest = Quote-RemotePath "$destinationRoot/latest.json"
            $remoteJsonLines = Read-SshCommand "if [ -f $remoteLatest ]; then cat $remoteLatest; fi" "Failed to read remote latest.json for $env:BRAND"

            $now = (Get-Date).ToUniversalTime().ToString("o")
            $remoteJson = ($remoteJsonLines -join "`n").Trim()
            $manifest = $null
            if (-not [string]::IsNullOrWhiteSpace($remoteJson)) {
              try {
                $candidate = $remoteJson | ConvertFrom-Json
                $candidateSemver = [string]$candidate.semver
                if ($candidateSemver -eq [string]$env:VERSION) {
                  $manifest = $candidate
                } elseif ($candidateSemver -and (Compare-Semver $candidateSemver $env:VERSION) -gt 0) {
                  Write-Warning "Skipping latest.json update for $env:BRAND $env:VERSION because remote latest.json already points at newer version $candidateSemver."
                  return
                }
              } catch {
                Write-Host "Ignoring invalid remote latest.json for ${env:BRAND}: $($_.Exception.Message)"
              }
            }

            if (-not $manifest) {
              $manifest = [pscustomobject]@{
                repository = $env:GITHUB_REPOSITORY
                version = "v$env:VERSION"
                semver = $env:VERSION
                publishedAt = $now
                sourceUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$env:VERSION"
                updatedAt = $now
                assets = [pscustomobject]@{}
              }
            }
            if (-not $manifest.PSObject.Properties['assets'] -or -not $manifest.assets) {
              $manifest | Add-Member -MemberType NoteProperty -Name assets -Value ([pscustomobject]@{}) -Force
            }
            $manifest.updatedAt = $now
            $manifest.assets | Add-Member -MemberType NoteProperty -Name $assetPatch.platformKey -Value $assetPatch.asset -Force
            $manifest | ConvertTo-Json -Depth 20 | Set-Content -Path $latestPath -Encoding utf8
            Invoke-RemoteUpload $latestPath $destinationRoot "latest.json"
          } finally {
            Exit-RemoteLock $latestLockDirectory
          }

          Write-Host "Uploaded $env:BRAND channel files to $env:UPDATE_FEED_BASE_URL/$env:BRAND/$env:CHANNEL/"
          Write-Host "Uploaded $env:BRAND archive files to $env:UPDATE_FEED_BASE_URL/$env:BRAND/releases/v$env:VERSION/"
          Write-Host "Uploaded $env:BRAND update manifest to $env:UPDATE_FEED_BASE_URL/$env:BRAND/latest.json"
